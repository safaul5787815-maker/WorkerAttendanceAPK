<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worker Attendance App v2</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

</head>

<body>

<div class="container">

<div class="top-bar">

    <h1>👷 Worker Attendance App</h1>

<button class="top-menu-btn"
        onclick="openSettings(event)">
    Settings
</button>

</div>

</div>

<div class="profile">
    <img src="profile.png" class="profile-img">
</div>

    <div class="dashboard">

        <div class="card">
            <h3>Total Workers</h3>
            <h2 id="totalWorkers">0</h2>
        </div>

        <div class="card">
            <h3>Total Salary</h3>
            <h2>₹ <span id="dashboardSalary">0</span></h2>
        </div>

    </div>

    <div class="box">

        <input
            type="text"
            id="name"
            placeholder="Worker Name">

        <input
            type="number"
            id="wage"
            placeholder="Daily Wage">

        <div class="btns">

            <button onclick="addWorker()">
                ➕ Add Worker
            </button>

            <button onclick="printReport()">
                📄 PDF
            </button>


        </div>

    </div>



<div id="workerList" class="worker-cards">

</div>


<!-- Popup Menu -->

<div id="popupMenu" class="popup-menu">

    <div onclick="menuHistory()">📜 History</div>

    <div onclick="menuPDF()">📄 PDF</div>

    <div onclick="menuDelete()">🗑 Delete</div>

</div>

<!-- Attendance Modal -->

<div id="attendanceModal" class="attendance-modal">

    <div class="attendance-box">

        <h2>Attendance Calendar</h2>

        <div class="calendar-header">

            <button onclick="prevMonth()">◀</button>

            <h3 id="calendarTitle"></h3>

            <button onclick="nextMonth()">▶</button>

        </div>

        <div id="calendarGrid"></div>

        <br>

        <button onclick="closeAttendance()">
            Close
        </button>

    </div>

</div>

<!-- Date Action -->

<div id="dateActionModal" class="attendance-modal">

    <div class="attendance-box">

        <h3 id="selectedDateTitle"></h3>

        <button onclick="markDatePresent()">
            ✅ Present
        </button>

        <button onclick="markDateAbsent()">
            ❌ Absent
        </button>

        <button onclick="markDateHalfDay()">
            🟡 Half Day
        </button>

        <button onclick="addDateOT()">
            ⏱ Add OT
        </button>

        <br><br>

        <button onclick="closeDateAction()">
            Close
        </button>

    </div>

</div>

<!-- Month Selector -->

<div id="monthSelectorModal" class="attendance-modal">

    <div class="attendance-box">

        <h3>Select Report Month</h3>

        <div id="monthList"></div>

        <br>

        <button onclick="closeMonthSelector()">
            Cancel
        </button>

    </div>

</div>

<!-- Payment Month Selector -->

<div id="paymentMonthModal" class="attendance-modal">

    <div class="attendance-box">

        <h3>💵 Select Payment Month</h3>

        <div id="paymentMonthList"></div>

        <br>

        <button onclick="closePaymentMonthSelector()">
            Cancel
        </button>

    </div>

</div>

<!-- Payment History Modal -->

<div id="paymentHistoryModal" class="attendance-modal">

    <div class="attendance-box">

        <div id="paymentHistoryContent"></div>

    </div>

</div>

<!-- PIN LOCK -->

<div id="pinModal" class="attendance-modal">

    <div class="attendance-box">

        <h2 id="pinTitle">Enter PIN</h2>

        <input
            id="pinInput"
            type="password"
            inputmode="numeric"
            pattern="[0-9]*"
            autocomplete="off"
            maxlength="4"
            placeholder="4 Digit PIN">

        <br><br>

        <button onclick="checkPin()">
            Unlock
        </button>

    </div>

</div>

<!-- Settings Modal -->

<div id="settingsModal" class="attendance-modal">

    <div class="attendance-box">

        <h2>⚙️ Settings</h2>

        <button onclick="enablePinLock()">
            🔐 Enable PIN Lock
        </button>

        <button id="fingerprintBtn"
                onclick="toggleFingerprint()">
            👆 Fingerprint Lock : OFF
        </button>

        <button onclick="changePin()">
            🔑 Change PIN
        </button>

        <button onclick="removePin()">
            ❌ Remove PIN
        </button>

        <button onclick="backupData()">
            💾 Backup Data
        </button>

        <button onclick="restoreData()">
            📂 Restore Data
        </button>

        <button onclick="aboutApp()">
            ℹ️ About App
        </button>

        <br>

        <button onclick="closeSettings()">
            Close
        </button>

    </div>

</div>

<script src="script.js"></script>
<script src="cordova.js"></script>

<input
    type="file"
    id="restoreFile"
    accept=".json"
    style="display:none"
    onchange="restoreFileSelected(event)">

<!-- PIN Manager Modal -->

<div id="pinManagerModal" class="attendance-modal">

    <div class="attendance-box">

        <h2 id="pinManagerTitle">PIN</h2>

        <input
            id="pinManagerInput"
            type="tel"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="4"
            placeholder="4 Digit PIN">

        <br><br>

        <button id="pinManagerOk">
            OK
        </button>

        <button onclick="closePinManager()">
            Cancel
        </button>

    </div>

</div>

<!-- Paid Amount Modal -->

<div id="paidModal" class="attendance-modal">

    <div class="attendance-box">

        <h2>💵 Paid Amount</h2>

        <input
            id="paidInput"
            type="number"
            inputmode="numeric"
            placeholder="Enter Amount">

<div class="paid-date-row"
     style="display:flex; flex-direction:row; align-items:center; justify-content:center; gap:6px;">

    <input
        id="paidDay"
        type="number"
        inputmode="numeric"
        placeholder="DD"
        maxlength="2"
        style="width:65px !important; text-align:center; margin:10px 0;">

    <span>/</span>

    <input
        id="paidMonth"
        type="number"
        inputmode="numeric"
        placeholder="MM"
        maxlength="2"
        style="width:65px !important; text-align:center; margin:10px 0;">

    <span>/</span>

    <input
        id="paidYear"
        type="number"
        inputmode="numeric"
        placeholder="YYYY"
        maxlength="4"
        style="width:85px !important; text-align:center; margin:10px 0;">

</div>

        <br><br>

        <button onclick="savePaidAmount()">
            Save
        </button>

        <button onclick="closePaidDialog()">
            Cancel
        </button>

    </div>

</div>

</body>
</html>
