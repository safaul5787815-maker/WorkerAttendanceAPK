name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install Cordova
        run: npm install -g cordova

      - name: Add Android platform
        run: cordova platform add android

      - name: Remove duplicate storage permission
        run: |
          sed -i '/WRITE_EXTERNAL_STORAGE/d' platforms/android/app/src/main/AndroidManifest.xml

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/workerattendance-release.jks"

      - name: Create build config
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > build.json <<EOF
          {
            "android": {
              "release": {
                "keystore": "$RUNNER_TEMP/workerattendance-release.jks",
                "storePassword": "$KEYSTORE_PASSWORD",
                "alias": "$KEY_ALIAS",
                "password": "$KEY_PASSWORD"
              }
            }
          }
          EOF

      - name: Remove duplicate storage permission
        run: |
          sed -i '/android.permission.WRITE_EXTERNAL_STORAGE/d' \
            platforms/android/app/src/main/AndroidManifest.xml

      - name: Prepare Android
        run: cordova prepare android

      - name: Remove duplicate storage permission
        run: |
          sed -i '/WRITE_EXTERNAL_STORAGE/d' \
            platforms/android/app/src/main/AndroidManifest.xml

          echo "Remaining permission:"
          grep -n "WRITE_EXTERNAL_STORAGE" \
            platforms/android/app/src/main/AndroidManifest.xml || true

      - name: Build Release APK
        run: cordova compile android --release --buildConfig=build.json

- name: Prepare APK
  run: |
    mkdir -p release

    echo "=== APK files ==="
    find platforms/android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -print

    APK=$(find platforms/android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

    if [ -z "$APK" ]; then
      echo "ERROR: Release APK not found"
      exit 1
    fi

    cp "$APK" release/WorkerAttendance.apk

    echo "APK copied:"
    ls -lh release/WorkerAttendance.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkerAttendance-APK
          path: release/WorkerAttendance.apk
