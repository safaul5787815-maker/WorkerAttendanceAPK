name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Cordova
        run: npm install -g cordova

      - name: Install project dependencies
        run: npm install

      - name: Add Android platform
        run: cordova platform add android

- name: Fix duplicate storage permission
  run: |
    sed -i '/WRITE_EXTERNAL_STORAGE/d' \
      platforms/android/app/src/main/AndroidManifest.xml

      - name: Fix duplicate storage permission
        run: |
          sed -i '/WRITE_EXTERNAL_STORAGE/d' \
            platforms/android/app/src/main/AndroidManifest.xml

          echo "Remaining WRITE_EXTERNAL_STORAGE permissions:"
          grep -n "WRITE_EXTERNAL_STORAGE" \
            platforms/android/app/src/main/AndroidManifest.xml || true

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/workerattendance-release.jks"

      - name: Create Cordova signing config
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > build.json <<EOF
          {
            "android": {
              "release": {
                "keystore": "$RUNNER_TEMP/workerattendance-release.jks",
                "storePassword": "$KEYSTORE_PASSWORD",
                "alias": "$KEY_ALIAS",
                "password": "$KEY_PASSWORD"
              }
            }
          }
          EOF

      - name: Build signed Release APK
        run: cordova build android --release --buildConfig=build.json

      - name: Rename APK
        run: |
          mkdir -p release
          cp platforms/android/app/build/outputs/apk/release/app-release.apk release/WorkerAttendance.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkerAttendance-APK
          path: release/WorkerAttendance.apk
