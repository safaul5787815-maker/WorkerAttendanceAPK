name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Cordova
        run: npm install -g cordova

      - name: Install project dependencies
        run: npm install

      - name: Add Android platform
        run: cordova platform add android

      - name: Fix duplicate storage permission
        run: |
          sed -i '/android:maxSdkVersion="32" android:name="android.permission.WRITE_EXTERNAL_STORAGE"/d' \
          platforms/android/app/src/main/AndroidManifest.xml

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/workerattendance-release.jks"

      - name: Create release signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > platforms/android/release-signing.properties <<EOF
          storeFile=$RUNNER_TEMP/workerattendance-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Configure Gradle signing
        run: |
          cat >> platforms/android/build.gradle <<'EOF'

          def signingPropertiesFile = file("release-signing.properties")
          def signingProperties = new Properties()

          if (signingPropertiesFile.exists()) {
              signingProperties.load(new FileInputStream(signingPropertiesFile))
          }

          android {
              signingConfigs {
                  release {
                      if (signingPropertiesFile.exists()) {
                          storeFile file(signingProperties['storeFile'])
                          storePassword signingProperties['storePassword
